[package]
name = "compactd"
version = "0.1.7"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Context compaction daemon for LLM agent sessions"
authors = ["compactd contributors"]
repository = "https://github.com/compactd/compactd"

[[bin]]
name = "compactd"
path = "src/main.rs"

[lib]
name = "compactd"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.44", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.35", features = ["bundled", "chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
notify = "8.0"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.16", features = ["v4", "serde"] }
dirs = "6.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3.20"
reqwest = { version = "0.12", features = ["json"] }

[[bench]]
name = "bench"
harness = false

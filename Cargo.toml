[package]
name = "compactd"
version = "0.1.7"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Context compaction daemon for LLM agent sessions"
authors = ["compactd contributors"]
repository = "https://github.com/compactd/compactd"

[[bin]]
name = "compactd"
path = "src/main.rs"
required-features = ["daemon"]

[lib]
name = "compactd"
path = "src/lib.rs"

[features]
default = ["daemon"]
# The REST daemon, SQLite store, session-directory scanner and CLI. Library
# consumers that only need the compaction algorithms (e.g. an embedding chat
# server with its own SQLite version) depend with `default-features = false`.
daemon = [
    "dep:tokio",
    "dep:axum",
    "dep:toml",
    "dep:rusqlite",
    "dep:tracing-subscriber",
    "dep:clap",
    "dep:walkdir",
    "dep:notify",
    "dep:dirs",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.16", features = ["v4", "serde"] }
tokio = { version = "1.44", features = ["full"], optional = true }
axum = { version = "0.8", features = ["macros"], optional = true }
toml = { version = "0.8", optional = true }
rusqlite = { version = "0.35", features = ["bundled", "chrono"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
walkdir = { version = "2.5", optional = true }
notify = { version = "8.0", optional = true }
dirs = { version = "6.0", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3.20"
reqwest = { version = "0.12", features = ["json"] }

[[test]]
name = "integration"
required-features = ["daemon"]

[[bench]]
name = "bench"
harness = false
